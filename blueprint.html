  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

50e2-00de-474e-8aec-a34ddb466470\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"5fa4245e-895e-4061-a777-dc3e8b551929\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"9b58e0ad-30c5-4a3f-ab46-5c65939efd27\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e994b6ef-0ac6-46a9-95f6-4f9ecf9c6278\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#ECE5D8;color:#171614;font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\na{color:#B8401C}\na:hover{color:#171614}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:1100px;margin:0 auto;padding:clamp(32px,6vw,80px) clamp(16px,4vw,48px)\">\n  <header style=\"border-bottom:2px solid #171614;padding-bottom:28px\">\n    <p style=\"margin:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#6B645A\">Website blueprint · v1 · Oct 2026<\u002Fp>\n    <h1 style=\"margin:10px 0 0;font-family:'Big Shoulders Display';font-weight:900;font-size:clamp(56px,10vw,128px);line-height:.85;text-transform:uppercase\">Koordinata<span style=\"color:#E4572E\">.<\u002Fspan> Street<\u002Fh1>\n    <p style=\"margin:18px 0 0;font-size:18px;line-height:1.5;max-width:60ch;color:#4A453E\">Design system, architecture, menu and booking UX for a two-location, chef-driven brand. Working prototype: <a href=\"index.html\">Koordinata Street<\u002Fa>.<\u002Fp>\n  <\u002Fheader>\n\n  <section data-screen-label=\"01 Design system\" style=\"padding:48px 0;border-bottom:1px solid #CFC6B6\">\n    <h2 style=\"margin:0 0 6px;font-family:'Big Shoulders Display';font-weight:900;font-size:44px;text-transform:uppercase\">01 · Design system<\u002Fh2>\n    <p style=\"margin:0 0 24px;color:#4A453E;font-size:16px;max-width:64ch;line-height:1.5\">Charcoal and linen do 90% of the work. One accent per location gives each concept its own identity without splitting the brand.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:88px;background:#171614\"><\u002Fdiv><strong style=\"font-size:14px\">Ugalj · #171614<\u002Fstrong><span style=\"font-size:13px;color:#6B645A\">Primary dark ground<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:88px;background:#24221F\"><\u002Fdiv><strong style=\"font-size:14px\">Dim · #24221F<\u002Fstrong><span style=\"font-size:13px;color:#6B645A\">Panels on dark<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:88px;background:#9A9184\"><\u002Fdiv><strong style=\"font-size:14px\">Kamen · #9A9184<\u002Fstrong><span style=\"font-size:13px;color:#6B645A\">Meta text on dark<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:88px;background:#ECE5D8;border:1px solid #CFC6B6\"><\u002Fdiv><strong style=\"font-size:14px\">Lan · #ECE5D8<\u002Fstrong><span style=\"font-size:13px;color:#6B645A\">Light ground, ink on dark<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:88px;background:#F6F2EA;border:1px solid #CFC6B6\"><\u002Fdiv><strong style=\"font-size:14px\">Papir · #F6F2EA<\u002Fstrong><span style=\"font-size:13px;color:#6B645A\">Cards on linen<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:88px;background:#E4572E\"><\u002Fdiv><strong style=\"font-size:14px\">Žar · #E4572E<\u002Fstrong><span style=\"font-size:13px;color:#6B645A\">Zemun accent, primary CTA<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:88px;background:#C9A86A\"><\u002Fdiv><strong style=\"font-size:14px\">Mesing · #C9A86A<\u002Fstrong><span style=\"font-size:13px;color:#6B645A\">Dositejeva accent<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:88px;background:#7FA65A\"><\u002Fdiv><strong style=\"font-size:14px\">Bosiljak · #7FA65A<\u002Fstrong><span style=\"font-size:13px;color:#6B645A\">Status: fresh / vege<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:14px 0 0;font-size:13px;color:#6B645A\">Accents sit on charcoal or carry charcoal text — never accent text on linen (fails contrast).<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:36px\">\n      <div style=\"background:#171614;color:#ECE5D8;padding:24px\"><p style=\"margin:0;font-family:'Big Shoulders Display';font-weight:900;font-size:64px;line-height:.85;text-transform:uppercase\">Plotna<\u002Fp><p style=\"margin:12px 0 0;font-size:14px;color:#9A9184\">Big Shoulders Display 800–900 · headlines, prices, signage. Condensed street-sign energy.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#F6F2EA;padding:24px\"><p style=\"margin:0;font-size:22px;font-weight:600;line-height:1.3\">Pljeskavica od junećeg rebra, kajmak, pečena paprika<\u002Fp><p style=\"margin:12px 0 0;font-size:14px;color:#6B645A\">Instrument Sans 400–700 · UI, menu items, body. Full Serbian Latin (č ć š ž đ).<\u002Fp><\u002Fdiv>\n      <div style=\"background:#F6F2EA;padding:24px\"><p style=\"margin:0;font-family:Newsreader;font-style:italic;font-size:30px;line-height:1.2\">sporije, preciznije, uz sveću<\u002Fp><p style=\"margin:12px 0 0;font-size:14px;color:#6B645A\">Newsreader Italic · quotes and bistro moments only. Signals the refined side.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin:36px 0 12px;font-size:18px\">Micro-interactions &amp; treatments<\u002Fh3>\n    <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.5;color:#2E2B28\">\n      <li><strong>Ember pulse<\u002Fstrong> — a live orange dot next to today’s date and “open now” states; the kitchen is on.<\u002Fli>\n      <li><strong>Market ticker<\u002Fstrong> — full-bleed ember marquee of today’s produce and its origin (Tara, Grocka, Sjenica). Fed from the same menu data.<\u002Fli>\n      <li><strong>Flickering full stop<\u002Fstrong> in the logo and hero — subtle flame flicker, 3s loop.<\u002Fli>\n      <li><strong>Chalkboard logic<\u002Fstrong> — sold-out items fade and strike through instead of disappearing (scarcity = proof of freshness).<\u002Fli>\n      <li><strong>Hard edges<\u002Fstrong> — no rounded corners, no soft gradients; 1px rules and dotted price leaders like a handwritten menu.<\u002Fli>\n      <li><strong>Photography<\u002Fstrong> — handheld, high-contrast, steam and smoke; hands, knives, crates. Never plated-on-white stock.<\u002Fli>\n      <li><strong>Press feedback<\u002Fstrong> — card lift on hover, accent fill on selected slot/day, instant inline confirmations.<\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <section data-screen-label=\"02 Architecture\" style=\"padding:48px 0;border-bottom:1px solid #CFC6B6\">\n    <h2 style=\"margin:0 0 6px;font-family:'Big Shoulders Display';font-weight:900;font-size:44px;text-transform:uppercase\">02 · Information architecture<\u002Fh2>\n    <p style=\"margin:0 0 24px;color:#4A453E;font-size:16px;max-width:64ch;line-height:1.5\">One-page homepage for discovery; two lightweight location pages for SEO and direct links. Every page ends at the same booking widget.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px\">\n      <div style=\"background:#171614;color:#ECE5D8;padding:24px;font-size:15px;line-height:1.9\">\n        <p style=\"margin:0 0 8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9A9184\">Sitemap<\u002Fp>\n        <div style=\"font-weight:700\">/ — Početna<\u002Fdiv>\n        <div style=\"padding-left:18px\">/zemun — Zemunska pijaca <span style=\"color:#9A9184\">(meni, sati, mapa)<\u002Fspan><\u002Fdiv>\n        <div style=\"padding-left:18px\">/dositejeva — Bistro <span style=\"color:#9A9184\">(degustacija, vina)<\u002Fspan><\u002Fdiv>\n        <div style=\"padding-left:18px\">/meni/[lokacija] — Živi meni<\u002Fdiv>\n        <div style=\"padding-left:36px;color:#9A9184\">/m/[lokacija]/[sto] — QR ulaz za stolom<\u002Fdiv>\n        <div style=\"padding-left:18px\">/rezervacija — Booking <span style=\"color:#9A9184\">(?lok=zemun)<\u002Fspan><\u002Fdiv>\n        <div style=\"padding-left:18px\">/sef — Stefan Živković<\u002Fdiv>\n        <div style=\"padding-left:18px\">/dogadjaji — Grupe &amp; privatne večere<\u002Fdiv>\n        <div style=\"padding-left:18px;color:#9A9184\">/en — English mirror<\u002Fdiv>\n      <\u002Fdiv>\n      <ol style=\"margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.5\">\n        <li><strong>Header<\u002Fstrong> — logo, anchors, phone, persistent “Rezerviši sto”. Mobile: sticky bottom bar (Pozovi / Rezerviši).<\u002Fli>\n        <li><strong>Hero<\u002Fstrong> — “Kuhinja bez zidova.”, today’s date, two CTAs, open-kitchen photo, produce ticker.<\u002Fli>\n        <li><strong>Lokacije<\u002Fstrong> — two equal cards; live open/closed status; each card routes to its menu or booking.<\u002Fli>\n        <li><strong>Meni dana<\u002Fstrong> — location toggle, micro-season line, “updated at” stamp, sold-out states, QR note.<\u002Fli>\n        <li><strong>Šef<\u002Fstrong> — portrait, quote, Gault&amp;Millau credential, producers.<\u002Fli>\n        <li><strong>Rezervacije<\u002Fstrong> — 5-step inline widget, pre-filled by the chosen location.<\u002Fli>\n        <li><strong>Footer<\u002Fstrong> — both addresses, hours, closures, socials, coordinates.<\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"03 Menu &amp; booking\" style=\"padding:48px 0;border-bottom:1px solid #CFC6B6\">\n    <h2 style=\"margin:0 0 6px;font-family:'Big Shoulders Display';font-weight:900;font-size:44px;text-transform:uppercase\">03 · Dynamic menu &amp; QR<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px;margin-top:20px\">\n      <div>\n        <h3 style=\"margin:0 0 10px;font-size:18px\">Chef updates in 30 seconds<\u002Fh3>\n        <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.5\">\n          <li>Password-protected <strong>“Režim kuhinje”<\u002Fstrong> on the phone (try it in the prototype): toggle Nestalo, ±50 RSD, Novo danas, add dish.<\u002Fli>\n          <li>Each item: name, ingredients/origin, price, category, tags (vege, alergeni 1–14 per EU list), location.<\u002Fli>\n          <li>“Ažurirano u 11:42” stamp builds trust that the menu is real today.<\u002Fli>\n          <li>Micro-season line and ticker pull from the same data — one edit, updated everywhere.<\u002Fli>\n          <li>Optional auto-post of the daily menu as an Instagram story card.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"margin:0 0 10px;font-size:18px\">QR strategy<\u002Fh3>\n        <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.5\">\n          <li>One printed code per table: <code>koordinata.rs/m/zemun/4<\u002Fcode> — opens straight to today’s menu, no app, no PDF.<\u002Fli>\n          <li>Table ID enables “call the waiter” and future pay-at-table without reprinting.<\u002Fli>\n          <li>Engraved wood/steel tags at the market (weather-proof); small linen cards in the bistro.<\u002Fli>\n          <li>Page under 100 KB, cached offline — market Wi-Fi is unreliable.<\u002Fli>\n          <li>Large type, dark mode by default (sunlight + candlelight), allergens one tap away.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h2 style=\"margin:48px 0 6px;font-family:'Big Shoulders Display';font-weight:900;font-size:44px;text-transform:uppercase\">Booking workflow<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:20px\">\n      <div style=\"background:#171614;color:#ECE5D8;padding:16px\"><p style=\"margin:0;font-family:'Big Shoulders Display';font-weight:900;font-size:32px;color:#E4572E\">1<\u002Fp><p style=\"margin:6px 0 0;font-size:14px;line-height:1.4\">Lokacija — sets hours, slot length, capacity<\u002Fp><\u002Fdiv>\n      <div style=\"background:#171614;color:#ECE5D8;padding:16px\"><p style=\"margin:0;font-family:'Big Shoulders Display';font-weight:900;font-size:32px;color:#E4572E\">2<\u002Fp><p style=\"margin:6px 0 0;font-size:14px;line-height:1.4\">Dan — closed days greyed out<\u002Fp><\u002Fdiv>\n      <div style=\"background:#171614;color:#ECE5D8;padding:16px\"><p style=\"margin:0;font-family:'Big Shoulders Display';font-weight:900;font-size:32px;color:#E4572E\">3<\u002Fp><p style=\"margin:6px 0 0;font-size:14px;line-height:1.4\">Gosti — 1–8 online, 9+ routed to phone<\u002Fp><\u002Fdiv>\n      <div style=\"background:#171614;color:#ECE5D8;padding:16px\"><p style=\"margin:0;font-family:'Big Shoulders Display';font-weight:900;font-size:32px;color:#E4572E\">4<\u002Fp><p style=\"margin:6px 0 0;font-size:14px;line-height:1.4\">Termin — only slots that fit the party<\u002Fp><\u002Fdiv>\n      <div style=\"background:#171614;color:#ECE5D8;padding:16px\"><p style=\"margin:0;font-family:'Big Shoulders Display';font-weight:900;font-size:32px;color:#E4572E\">5<\u002Fp><p style=\"margin:6px 0 0;font-size:14px;line-height:1.4\">Ime + mobilni → instant SMS confirmation<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px;margin-top:28px\">\n      <div style=\"background:#F6F2EA;padding:22px;border-top:4px solid #E4572E\">\n        <h3 style=\"margin:0 0 10px;font-size:18px\">Zemunska pijaca<\u002Fh3>\n        <ul style=\"margin:0;padding-left:20px;font-size:15px;line-height:1.6\">\n          <li>Lunch slots 11:00–15:30, every 30 min, ~60 min table time<\u002Fli>\n          <li>Limited seats per slot; 3 tables never bookable (walk-in)<\u002Fli>\n          <li>Rain rule: auto-SMS option to move to Dositejeva or reschedule<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#F6F2EA;padding:22px;border-top:4px solid #C9A86A\">\n        <h3 style=\"margin:0 0 10px;font-size:18px\">Bistro Dositejeva<\u002Fh3>\n        <ul style=\"margin:0;padding-left:20px;font-size:15px;line-height:1.6\">\n          <li>28 seats, two turns (18:00–19:00 / 20:30–21:30 starts)<\u002Fli>\n          <li>Tasting menu flagged at booking; allergies captured upfront<\u002Fli>\n          <li>Card guarantee for 5+ guests to curb no-shows<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#F6F2EA;padding:22px;border-top:4px solid #171614\">\n        <h3 style=\"margin:0 0 10px;font-size:18px\">Fewer calls to 064 593 9352<\u002Fh3>\n        <ul style=\"margin:0;padding-left:20px;font-size:15px;line-height:1.6\">\n          <li>Reminder SMS 3 h before, one-tap cancel frees the slot<\u002Fli>\n          <li>Instagram/Facebook “Book” buttons deep-link to /rezervacija<\u002Fli>\n          <li>Staff tablet view: day sheet, covers per slot, manual phone entry<\u002Fli>\n          <li>Phone kept for groups 9+ and events only<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"04 Build\" style=\"padding:48px 0\">\n    <h2 style=\"margin:0 0 6px;font-family:'Big Shoulders Display';font-weight:900;font-size:44px;text-transform:uppercase\">04 · Build &amp; launch<\u002Fh2>\n    <ul style=\"margin:16px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.5;max-width:72ch\">\n      <li><strong>Front-end:<\u002Fstrong> static site (Astro or plain HTML), the prototype’s components ported 1:1; mobile-first, Lighthouse 95+.<\u002Fli>\n      <li><strong>Menu data:<\u002Fstrong> headless CMS (Sanity / Directus) or a Google Sheet → JSON; webhooks rebuild the menu in seconds.<\u002Fli>\n      <li><strong>Booking:<\u002Fstrong> small API (Supabase/Postgres) with slots + capacity tables, SMS via Infobip; or a white-labelled booking service if speed matters more than control.<\u002Fli>\n      <li><strong>SEO:<\u002Fstrong> Restaurant schema per location, Google Business Profile booking link, Serbian primary, English mirror.<\u002Fli>\n      <li><strong>Phase 1 (3 wks):<\u002Fstrong> site + live menu + QR. <strong>Phase 2 (3 wks):<\u002Fstrong> booking + SMS + staff view.<\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
